<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Chord Buddy">
<meta name="description" content="Random chord practice with a metronome">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Chord Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c11;
  --ink:#ffffff;
  --muted:rgba(255,255,255,.62);
  --faint:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.10);
  --glass-border:rgba(255,255,255,.12);
  --glass-hi:rgba(255,255,255,.18);
  --shade:rgba(0,0,0,.6);
  --blob1:#4a1a3a; --blob2:#1f2150; --blob3:#0f3040; --blob4:#3d2410;
  --hot:linear-gradient(135deg,#ff2e88 0%,#ff6a3d 55%,#ffc43d 100%);
  --cool:linear-gradient(135deg,#00d4ff 0%,#7a3cff 100%);
  --hot-glow:rgba(255,46,136,.55);
  --side-ink:rgba(255,255,255,.72);
  --next-ink:rgba(255,255,255,.55);
  --d:clamp(110px,32vw,168px);
  --display:'Sora','Manrope',system-ui,sans-serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Living background */
.bgfx{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px)}
.bgfx i{position:absolute;border-radius:50%;opacity:.55}
.bgfx i:nth-child(1){width:55vmax;height:55vmax;left:-5%;top:-5%;background:var(--blob1);animation:drift1 22s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:50vmax;height:50vmax;right:-10%;top:10%;background:var(--blob2);animation:drift2 26s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:45vmax;height:45vmax;left:10%;bottom:-10%;background:var(--blob3);animation:drift3 24s ease-in-out infinite alternate;opacity:.6}
.bgfx i:nth-child(4){width:30vmax;height:30vmax;right:5%;bottom:5%;background:var(--blob4);animation:drift1 30s ease-in-out infinite alternate-reverse;opacity:.55}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,12vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.1)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px -12px var(--shade);
}

.app{position:relative;z-index:1;overflow:hidden;height:100%;max-width:560px;margin:0 auto;padding:18px 22px 24px;display:flex;flex-direction:column}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-size:13px;color:var(--muted);font-weight:600}
.addfab{flex:none;aspect-ratio:1;padding:0;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--hot);color:#fff;box-shadow:0 10px 28px -8px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.addfab:active{transform:scale(.93)}
.addfab svg{width:22px;height:22px}

/* Stage */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px}
.track{position:relative;height:calc(var(--d) + 60px);margin:0 -22px}
.rail{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 15%,rgba(255,255,255,.22) 85%,rgba(255,255,255,0))}

.chord{
  aspect-ratio:1;
  position:absolute;top:50%;left:50%;
  width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;letter-spacing:-.03em;white-space:nowrap;user-select:none;
  background:var(--glass);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);will-change:left,transform;
  box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -14px var(--shade);
  transition-property:left,transform,color,opacity,box-shadow;
  transition-duration:var(--t,600ms);
  transition-timing-function:cubic-bezier(.65,0,.25,1);
}
.chord::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--hot);opacity:0;transition:opacity var(--t,600ms) cubic-bezier(.65,0,.25,1)}
.chord::after{content:"";position:absolute;inset:8% 18% 55% 18%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:0;transition:opacity var(--t,600ms)}
.chord span{position:relative;z-index:1}
.chord .ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.0);z-index:0;pointer-events:none}

.p-out   {left:-20%;transform:scale(.42);opacity:0;color:var(--side-ink)}
.p-left  {left:8%;transform:scale(.42);color:var(--side-ink)}
.p-left::before{opacity:.28}
.p-center{left:50%;transform:scale(1);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 24px 70px -12px var(--hot-glow),0 0 0 10px rgba(255,255,255,.06)}
.p-center::before{opacity:1}
.p-center::after{opacity:.5}
.p-center span{text-shadow:0 2px 12px rgba(120,0,50,.35)}
.p-right {left:92%;transform:scale(.42);color:var(--next-ink)}
.p-in    {left:120%;transform:scale(.42);opacity:0;color:var(--next-ink)}

.p-center.pulse .ring{animation:ring .5s ease-out}
.p-center.pulse.down .ring{animation-name:ringBig}
@keyframes ring{from{border-color:rgba(255,255,255,.45);transform:scale(.96)}to{border-color:rgba(255,255,255,0);transform:scale(1.12)}}
@keyframes ringBig{from{border-color:rgba(255,255,255,.8);transform:scale(.96)}to{border-color:rgba(255,255,255,0);transform:scale(1.22)}}

.label-next{position:absolute;right:calc(8% - 4px);top:calc(50% + var(--d) * .21 + 8px);transform:translateX(50%);font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;padding:0 48px}
.empty b{font-family:var(--display);font-weight:500;font-size:20px}
.empty span{color:var(--muted);font-size:15px}
.track.is-empty .empty{display:flex}
.track.is-empty .rail,.track.is-empty .label-next{opacity:0}

/* Beat bars */
.beats{display:flex;justify-content:center;gap:8px;padding:0 6px}
.beats span{flex:0 1 34px;min-width:8px;height:6px;border-radius:3px;background:var(--glass-strong);border:1px solid var(--glass-border);transition:background .08s,box-shadow .08s}
.beats span.on{background:var(--cool);border-color:transparent;box-shadow:0 0 16px rgba(0,212,255,.7)}
.beats span.on:first-child{background:var(--hot);box-shadow:0 0 16px var(--hot-glow)}

/* Controls */
.controls{display:flex;flex-direction:column;align-items:center;gap:16px}
.play{flex:none;aspect-ratio:1;padding:0;width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--cool);box-shadow:0 14px 36px -10px rgba(0,180,255,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:28px;height:28px}
.play.is-on{background:var(--hot);box-shadow:0 14px 36px -10px var(--hot-glow),inset 0 1px 0 rgba(255,255,255,.5)}

.deck{width:100%;border-radius:24px;padding:4px 16px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px}
.drow+.drow{border-top:1px solid var(--glass-border)}
.dlabel{display:flex;flex-direction:column;gap:3px;min-width:0}
.dlabel span{font-weight:700;font-size:16px;letter-spacing:.005em}
.dlabel small{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{flex:none;display:flex;align-items:center;gap:4px}
.step{flex:none;aspect-ratio:1;width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:grid;place-items:center;touch-action:manipulation;transition:transform .12s,background .12s}
.step:active{transform:scale(.9);background:var(--glass-strong)}
.step svg{flex:none;width:16px;height:16px}
.dval{min-width:68px;display:flex;align-items:center;justify-content:center;gap:6px}
.num,.bnum{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.num{background:var(--hot);-webkit-background-clip:text;background-clip:text;color:transparent}
.sig{font-size:11.5px;font-weight:700;color:#5ee7ff;padding:3px 7px;border-radius:999px;background:rgba(0,212,255,.12)}
.switch{flex:none;width:52px;height:30px;padding:0;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-strong);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s}
.switch.on{background:var(--cool);border-color:transparent;box-shadow:0 0 18px -4px rgba(0,212,255,.8)}
.switch.on i{transform:translateX(22px)}
.seg{flex:none;display:flex;padding:3px;gap:2px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass)}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-checked="true"]{background:var(--cool);color:#fff;box-shadow:0 0 18px -4px rgba(0,212,255,.8)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:6;left:10px;right:10px;bottom:10px;margin:0 auto;max-width:540px;border-radius:28px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(115%);transition:transform .35s cubic-bezier(.3,.8,.3,1);max-height:85%;overflow-y:auto;background:rgba(24,24,32,.78)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);margin:-8px auto 14px}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px;font-weight:600}
.row{display:flex;gap:10px}
.row input{-webkit-user-select:text;user-select:text;flex:1;min-width:0;font:inherit;font-weight:600;font-size:17px;padding:14px 16px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink)}
.row input::placeholder{color:var(--faint)}
.row input:focus{outline:none;border-color:rgba(255,46,136,.8);box-shadow:0 0 0 4px rgba(255,46,136,.18)}
.row .addnow{border:0;border-radius:16px;background:var(--hot);color:#fff;font-weight:700;font-size:16px;padding:0 22px;box-shadow:0 10px 24px -10px var(--hot-glow)}
.msg{min-height:20px;font-size:13px;font-weight:600;color:var(--muted);margin:10px 2px 8px}
.sheet h3{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 15px;font-family:var(--display);font-size:14px;font-weight:500;background:var(--glass);border:1px solid var(--glass-border);transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.mine{background:var(--hot);border-color:transparent;color:#fff;padding-right:8px;box-shadow:0 8px 20px -10px var(--hot-glow)}
.chip.mine .x{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--ui);font-size:12px}
.chip.used{opacity:.35}
.none{color:var(--muted);font-size:14px;font-weight:600}
.done{margin-top:22px;width:100%;border-radius:16px;padding:14px;font-size:16px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border)}

@media (max-height:680px){.stage{gap:16px}.play{width:60px;height:60px}.drow{min-height:56px}.controls{gap:12px}}
@media (prefers-reduced-motion:reduce){
  .bgfx i{animation:none}
  .chord,.chord::before,.chord::after,.sheet,.scrim{transition-duration:1ms !important}
  .p-center.pulse .ring{animation:none}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <div class="top">
    <div class="brand"><b>Chord Buddy</b><small id="count">3 chords in rotation</small></div>
    <button class="addfab" id="openSheet" aria-label="Add chords">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="track" id="track" aria-live="polite">
      <div class="rail"></div>
      <div class="label-next">Next</div>
      <div class="empty"><b>No chords yet</b><span>Tap + and add the chords you want to practice</span></div>
    </div>
    <div class="beats" id="beats" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="controls">
    <button class="play" id="play" aria-label="Start"></button>
    <div class="deck glass">
      <div class="drow">
        <div class="dlabel"><span>Speed</span><small>BPM</small></div>
        <div class="stepper">
          <button class="step" id="slower" aria-label="Slower"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <div class="dval"><span class="num" id="speedNum">60</span></div>
          <button class="step" id="faster" aria-label="Faster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="drow">
        <div class="dlabel"><span>Beats</span><small id="hint">Per chord</small></div>
        <div class="stepper">
          <button class="step" id="fewer" aria-label="Fewer beats per chord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <div class="dval"><span class="bnum" id="beatNum">4</span><span class="sig" id="sig">4/4</span></div>
          <button class="step" id="more" aria-label="More beats per chord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="drow">
        <div class="dlabel"><span>Order</span><small id="orderState">Shuffled</small></div>
        <div class="seg" role="radiogroup" aria-label="Chord order">
          <button id="orderRandom" role="radio" aria-checked="true">Random</button>
          <button id="orderSerial" role="radio" aria-checked="false">In order</button>
        </div>
      </div>
      <div class="drow">
        <div class="dlabel"><span>Beat sound</span><small id="soundState">On</small></div>
        <button class="switch on" id="sound" role="switch" aria-checked="true" aria-label="Beat sound"><i></i></button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab" aria-hidden="true"></div>
  <h2 id="sheetTitle">Your chords</h2>
  <p class="sub" id="sheetSub">They'll roll in a random order you can't predict.</p>
  <div class="row">
    <input id="chordInput" placeholder="Am, C, G, F" autocomplete="off" autocapitalize="characters" maxlength="40" aria-label="Chord name">
    <button class="addnow" id="addBtn">Add</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="chips" id="mine"></div>
  <h3>Quick add</h3>
  <div class="chips" id="quick"></div>
  <button class="done" id="closeSheet">Done</button>
</div>

<script>
(function(){
  var MIN=20, MAX=200, STEP=5, BMIN=1, BMAX=12;
  var QUICK=['C','D','E','F','G','A','B','Am','Dm','Em','Bm','F#m','C7','D7','G7','A7','E7','Cmaj7','Fmaj7','Asus2','Dsus4'];
  var ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>';
  var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>';
  var ICON_SOUND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.3a8 8 0 0 1 0 11.4"/></svg>';
  var ICON_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';

  var state={chords:['Em','A','G'],bpm:60,beats:4,sound:true,order:'random',playing:false};
  try{
    var saved=JSON.parse(localStorage.getItem('chordroll')||'null');
    if(saved){
      if(Array.isArray(saved.chords)) state.chords=saved.chords.filter(function(c){return typeof c==='string'&&c;});
      if(typeof saved.bpm==='number') state.bpm=Math.min(MAX,Math.max(MIN,saved.bpm));
      if(typeof saved.beats==='number') state.beats=Math.min(BMAX,Math.max(BMIN,saved.beats));
      if(typeof saved.sound==='boolean') state.sound=saved.sound;
      if(saved.order==='random'||saved.order==='serial') state.order=saved.order;
    }
  }catch(e){}
  function save(){try{localStorage.setItem('chordroll',JSON.stringify({chords:state.chords,bpm:state.bpm,beats:state.beats,sound:state.sound,order:state.order}));}catch(e){}}

  var $=function(id){return document.getElementById(id);};
  var track=$('track'), beatBox=$('beats'), playBtn=$('play'), soundBtn=$('sound');
  var els={left:null,center:null,right:null};

  /* ---------- Audio clock and click sound ---------- */
  var ctx=null;
  function ensureAudio(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC){try{ctx=new AC();}catch(e){ctx=null;}}
    }
    if(ctx&&ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
  }
  function now(){return ctx?ctx.currentTime:performance.now()/1000;}
  function click(time,accent){
    if(!ctx) return;
    var o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type='triangle';
    o.frequency.setValueAtTime(accent?1850:1150,time);
    o.frequency.exponentialRampToValueAtTime(accent?1400:850,time+0.05);
    f.type='highpass'; f.frequency.value=300;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(accent?0.9:0.45,time+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.07);
    o.connect(f); f.connect(g); g.connect(ctx.destination);
    o.start(time); o.stop(time+0.08);
  }

  /* ---------- Scheduler (keeps sound and visuals in time) ---------- */
  var schedTimer=null, nextTime=0, nextBeat=0, first=true, pending=[];
  function beatSec(){return 60/state.bpm;}
  function scheduler(){
    while(nextTime<now()+0.12){
      schedule(nextBeat,nextTime);
      nextTime+=beatSec();
      nextBeat=(nextBeat+1)%state.beats;
    }
  }
  function schedule(b,time){
    if(state.sound) click(time,b===0&&state.beats>1);
    var delay=Math.max(0,(time-now())*1000);
    var id=setTimeout(function(){
      pending=pending.filter(function(x){return x!==id;});
      onBeat(b);
    },delay);
    pending.push(id);
  }
  function onBeat(b){
    if(!state.playing) return;
    var changed=false;
    if(b===0&&!first){advance();changed=true;}
    first=false;
    lightBeat(b);
    if(changed) setTimeout(function(){pulse(true);},Math.min(450,beatSec()*600));
    else pulse(b===0);
  }

  /* ---------- Chord track ---------- */
  function setTransition(){track.style.setProperty('--t',Math.max(180,Math.min(650,beatSec()*700))+'ms');}
  function fontFor(name){var n=name.length;return n<=1?46:n===2?40:n===3?33:n===4?27:n===5?23:n===6?20:17;}
  function makeChord(name,pos){
    var d=document.createElement('div');
    d.className='chord '+pos; d.dataset.name=name;
    d.style.fontSize='calc(var(--d) * '+(fontFor(name)/100)+')';
    var ring=document.createElement('i'); ring.className='ring';
    var s=document.createElement('span'); s.textContent=name;
    d.appendChild(ring); d.appendChild(s);
    track.appendChild(d);
    return d;
  }
  function pick(exclude){
    var list=state.chords;
    if(!list.length) return null;
    if(list.length===1) return list[0];
    if(state.order==='serial'){
      // In order: the chord that comes after this one in your list, looping back to the start.
      if(exclude===null) return list[0];
      return list[(list.indexOf(exclude)+1)%list.length];
    }
    var c; do{c=list[Math.floor(Math.random()*list.length)];}while(c===exclude);
    return c;
  }
  function clearTrack(){
    Array.prototype.slice.call(track.querySelectorAll('.chord')).forEach(function(n){n.remove();});
    els={left:null,center:null,right:null};
  }
  function buildTrack(){
    clearTrack();
    if(!state.chords.length){track.classList.add('is-empty');return;}
    track.classList.remove('is-empty');
    var cur=pick(null);
    els.center=makeChord(cur,'p-center');
    els.right=makeChord(pick(cur),'p-right');
  }
  function advance(){
    if(!els.center) return;
    track.querySelectorAll('.p-out').forEach(function(n){n.remove();});
    if(els.left){var gone=els.left; gone.className='chord p-out'; setTimeout(function(){gone.remove();},900);}
    els.left=els.center; els.left.className='chord p-left';
    els.center=els.right; els.center.className='chord p-center';
    var incoming=makeChord(pick(els.center.dataset.name),'p-in');
    incoming.getBoundingClientRect();
    incoming.className='chord p-right';
    els.right=incoming;
  }
  function refreshNext(){
    // Swap the greyed "Next" chord so it matches the current order setting.
    if(!els.center) return;
    var want=pick(els.center.dataset.name);
    if(els.right&&els.right.dataset.name===want) return;
    if(els.right){var old=els.right; old.className='chord p-in'; setTimeout(function(){old.remove();},900);}
    var incoming=makeChord(want,'p-in');
    incoming.getBoundingClientRect();
    incoming.className='chord p-right';
    els.right=incoming;
  }
  function pulse(isDown){
    var c=els.center; if(!c) return;
    c.classList.remove('pulse','down'); void c.offsetWidth;
    c.classList.add('pulse'); if(isDown) c.classList.add('down');
  }
  function buildBeatBars(){
    beatBox.innerHTML='';
    for(var i=0;i<state.beats;i++) beatBox.appendChild(document.createElement('span'));
  }
  function lightBeat(i){
    var bars=beatBox.children;
    for(var k=0;k<bars.length;k++) bars[k].classList.toggle('on',k===i);
  }

  /* ---------- Keep screen on while playing ---------- */
  var wakeLock=null;
  function keepAwake(){
    try{
      if('wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(function(l){wakeLock=l;}).catch(function(){});
      }
    }catch(e){}
  }
  function letSleep(){try{if(wakeLock) wakeLock.release();}catch(e){} wakeLock=null;}

  /* ---------- Play / stop ---------- */
  function start(){
    if(!state.chords.length){openSheet();return;}
    ensureAudio();
    state.playing=true; first=true; nextBeat=0; nextTime=now()+0.06;
    scheduler(); schedTimer=setInterval(scheduler,25);
    keepAwake(); renderPlay();
  }
  function stop(){
    state.playing=false;
    clearInterval(schedTimer); schedTimer=null;
    pending.forEach(clearTimeout); pending=[];
    lightBeat(-1); letSleep(); renderPlay();
  }
  function renderPlay(){
    playBtn.innerHTML=state.playing?ICON_PAUSE:ICON_PLAY;
    playBtn.classList.toggle('is-on',state.playing);
    playBtn.setAttribute('aria-label',state.playing?'Pause':'Start');
  }

  /* ---------- Speed, beats, sound ---------- */
  function renderSpeed(){$('speedNum').textContent=state.bpm; setTransition();}
  function changeSpeed(dir){
    var v=Math.min(MAX,Math.max(MIN,state.bpm+dir*STEP));
    if(v===state.bpm) return;
    state.bpm=v; save(); renderSpeed();
  }
  function sigFor(n){return (n===6||n===9||n===12)?n+'/8':n+'/4';}
  function renderBeats(){
    $('beatNum').textContent=state.beats;
    $('sig').textContent=sigFor(state.beats);
    
    buildBeatBars();
  }
  function changeBeats(dir){
    var v=Math.min(BMAX,Math.max(BMIN,state.beats+dir));
    if(v===state.beats) return;
    state.beats=v; save();
    if(nextBeat>=v) nextBeat=0;
    renderBeats();
  }
  function renderSound(){
    soundBtn.classList.toggle('on',state.sound);
    soundBtn.setAttribute('aria-checked',state.sound?'true':'false');
    $('soundState').textContent=state.sound?'On':'Muted';
  }
  function toggleSound(){state.sound=!state.sound; if(state.sound) ensureAudio(); save(); renderSound();}
  function renderOrder(){
    var serial=state.order==='serial';
    $('orderRandom').setAttribute('aria-checked',serial?'false':'true');
    $('orderSerial').setAttribute('aria-checked',serial?'true':'false');
    $('orderState').textContent=serial?'As you added them':'Shuffled';
    $('sheetSub').textContent=serial?"They'll roll in the same order you add them.":"They'll roll in a random order you can't predict.";
  }
  function setOrder(o){
    if(state.order===o) return;
    state.order=o; save(); renderOrder();
    // Stopped and switching to "In order": start again from your first chord.
    if(o==='serial'&&!state.playing&&state.chords.length) buildTrack(); else refreshNext();
  }
  $('orderRandom').addEventListener('click',function(){setOrder('random');});
  $('orderSerial').addEventListener('click',function(){setOrder('serial');});

  function holdable(btn,fn,dir){
    var t1=null,t2=null;
    function end(){clearTimeout(t1);clearInterval(t2);}
    btn.addEventListener('pointerdown',function(e){
      e.preventDefault(); fn(dir);
      t1=setTimeout(function(){t2=setInterval(function(){fn(dir);},110);},420);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,end);});
    btn.addEventListener('click',function(e){if(e.detail===0) fn(dir);});
  }
  holdable($('slower'),changeSpeed,-1);
  holdable($('faster'),changeSpeed,1);
  holdable($('fewer'),changeBeats,-1);
  holdable($('more'),changeBeats,1);
  soundBtn.addEventListener('click',toggleSound);
  playBtn.addEventListener('click',function(){state.playing?stop():start();});
  track.addEventListener('click',function(e){if(e.target.closest('.p-center')) state.playing?stop():start();});

  /* ---------- Chord list ---------- */
  function normalize(raw){
    var s=raw.replace(/\s+/g,'').replace(/♯/g,'#').replace(/♭/g,'b');
    return s?s.charAt(0).toUpperCase()+s.slice(1):'';
  }
  function valid(s){return /^[A-G]/.test(s)&&s.length<=8;}
  function flash(t){$('msg').textContent=t;}
  function addChords(raw){
    var parts=raw.split(/[,\/;]+|\s+(?=[A-Ga-g])/);
    var added=[],skipped=[];
    parts.forEach(function(p){
      var c=normalize(p); if(!c) return;
      if(!valid(c)){skipped.push(c);return;}
      if(state.chords.indexOf(c)!==-1) return;
      state.chords.push(c); added.push(c);
    });
    if(added.length) flash('Added '+added.join(', '));
    else if(skipped.length) flash('Chord names start with a letter from A to G');
    else flash('Already in your list');
    onChordsChanged();
  }
  function removeChord(c){
    state.chords=state.chords.filter(function(x){return x!==c;});
    flash('Removed '+c); onChordsChanged();
  }
  function renderCount(){
    var n=state.chords.length;
    $('count').textContent=n===0?'Add chords to begin':n===1?'1 chord in rotation':n+' chords in rotation';
  }
  function onChordsChanged(){
    save(); renderLists(); renderCount();
    if(!state.chords.length){stop();buildTrack();return;}
    var shown=[els.center,els.right].filter(Boolean).map(function(n){return n.dataset.name;});
    var broken=!els.center||shown.some(function(n){return state.chords.indexOf(n)===-1;});
    if(broken) buildTrack();
    else if(state.order==='serial') refreshNext();
  }
  function renderLists(){
    var mine=$('mine'); mine.innerHTML='';
    if(!state.chords.length){
      var p=document.createElement('span'); p.className='none'; p.textContent='Nothing here yet. Add two or more to practice switching.';
      mine.appendChild(p);
    }
    state.chords.forEach(function(c){
      var b=document.createElement('button');
      b.className='chip mine'; b.setAttribute('aria-label','Remove '+c);
      b.innerHTML='<span></span><span class="x" aria-hidden="true">✕</span>';
      b.firstChild.textContent=c;
      b.addEventListener('click',function(){removeChord(c);});
      mine.appendChild(b);
    });
    var quick=$('quick'); quick.innerHTML='';
    QUICK.forEach(function(c){
      var used=state.chords.indexOf(c)!==-1;
      var b=document.createElement('button');
      b.className='chip'+(used?' used':''); b.textContent=c;
      b.setAttribute('aria-label',used?'Remove '+c:'Add '+c);
      b.addEventListener('click',function(){used?removeChord(c):addChords(c);});
      quick.appendChild(b);
    });
  }
  function sheetOpen(){return $('sheet').classList.contains('open');}
  function openSheet(){
    flash(''); renderLists();
    try{history.pushState({sheet:1},'');}catch(e){}
    $('scrim').classList.add('open'); $('sheet').classList.add('open');
    setTimeout(function(){$('chordInput').focus();},250);
  }
  function hideSheet(){
    $('scrim').classList.remove('open'); $('sheet').classList.remove('open');
    $('chordInput').blur();
  }
  function closeSheet(){
    if(history.state&&history.state.sheet){history.back();} else hideSheet();
  }
  window.addEventListener('popstate',function(){if(sheetOpen()) hideSheet();});
  $('openSheet').addEventListener('click',openSheet);
  $('closeSheet').addEventListener('click',closeSheet);
  $('scrim').addEventListener('click',closeSheet);
  $('addBtn').addEventListener('click',function(){
    var v=$('chordInput').value; if(!v.trim()) return;
    addChords(v); $('chordInput').value=''; $('chordInput').focus();
  });
  $('chordInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('addBtn').click();}});
  document.addEventListener('keydown',function(e){
    var open=$('sheet').classList.contains('open');
    if(e.key==='Escape'&&open){closeSheet();return;}
    if(open) return;
    if(e.key===' '&&e.target===document.body){e.preventDefault();state.playing?stop():start();}
    if(e.key==='ArrowUp'||e.key==='ArrowRight') changeSpeed(1);
    if(e.key==='ArrowDown'||e.key==='ArrowLeft') changeSpeed(-1);
    if(e.key==='m'||e.key==='M') toggleSound();
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state.playing) stop();});

  renderPlay(); renderSpeed(); renderBeats(); renderSound(); renderOrder(); renderCount(); buildTrack();

  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
</script>
</body>
</html>
